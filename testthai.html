<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image with Shadow Border</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .image-wrapper {
            display: inline-block;
            border-radius: 10px;
            background: white;
            padding: 8px;
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.3),
                0 6px 6px rgba(0,0,0,0.2),
                0 0 0 2px rgba(255,255,255,0.5);
            transition: transform 0.3s ease;
        }

        .image-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 15px 30px rgba(0,0,0,0.4),
                0 10px 10px rgba(0,0,0,0.3),
                0 0 0 3px rgba(255,255,255,0.7);
        }

        .image-wrapper img {
            display: block;
            max-width: 500px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        /* Alternative shadow border styles - uncomment to try different effects */
        /*
        .shadow-border-1 {
            box-shadow: 0 0 0 5px #fff, 0 0 0 10px #667eea, 0 15px 30px rgba(0,0,0,0.3);
        }

        .shadow-border-2 {
            box-shadow: 0 0 0 8px rgba(255,255,255,0.5), 0 20px 30px rgba(0,0,0,0.3);
        }

        .shadow-border-3 {
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
            border: 3px solid white;
        }
        */

        .caption {
            margin-top: 15px;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image with Shadow Border</h1>
        
        <!-- Method 1: Using box-shadow for border effect -->
        <div class="image-wrapper">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500&auto=format" 
                 alt="Beautiful mountain landscape" 
                 title="Mountain Landscape">
        </div>
        <p class="caption">Beautiful mountain landscape with shadow border</p>
    </div>

    <!-- Alternative example with local image (uncomment and replace with your local image path) -->
    <!--
    <div class="container" style="margin-top: 30px;">

                 alt="Local image" 
                 title="Local Image">
        </div>
        <p class="caption">Local image with same shadow effect</p>
    </div>
    -->
</body>
</html>
